name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 実行中のデプロイは止めず、待っているものだけ最新に入れ替える
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # enablement: true は Pages が未設定なら自分で作りにいく。ただし個人リポジトリでは
      # ワークフローのトークンに作成権限が無く "Resource not accessible by integration"
      # で落ちることがある（このリポジトリがそうだった）。その場合は
      # Settings → Pages → Source を "GitHub Actions" にする初回設定を手で行う。
      # 一度作られてしまえば、この行はそのまま通る。
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
